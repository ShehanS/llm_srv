<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Trace WebSocket Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-connect {
            background: #28a745;
            color: white;
        }

        .btn-connect:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-disconnect {
            background: #dc3545;
            color: white;
        }

        .btn-disconnect:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #6c757d;
            color: white;
        }

        .btn-clear:hover {
            background: #5a6268;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #28a745;
        }

        .status-indicator.disconnected {
            background: #dc3545;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-weight: 600;
            color: #495057;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-left: auto;
            font-size: 14px;
            color: #6c757d;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .traces-container {
            padding: 30px;
            max-height: 500px;
            overflow-y: auto;
        }

        .trace-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .trace-item.status-running {
            border-left-color: #ffc107;
            background: #fff3cd;
        }

        .trace-item.status-complete {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .trace-item.status-error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .trace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .trace-title {
            font-weight: 600;
            color: #212529;
        }

        .trace-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .trace-status.running {
            background: #ffc107;
            color: #212529;
        }

        .trace-status.complete {
            background: #28a745;
            color: white;
        }

        .trace-status.error {
            background: #dc3545;
            color: white;
        }

        .trace-details {
            font-size: 13px;
            color: #6c757d;
            line-height: 1.6;
        }

        .trace-data {
            margin-top: 10px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔌 Workflow Trace WebSocket Tester</h1>
        <p>Test real-time workflow trace streaming via WebSocket</p>
    </div>

    <div class="controls">
        <div class="form-group">
            <label for="serverUrl">Server URL</label>
            <input type="text" id="serverUrl" value="ws://localhost:8080/api/workflow/ws/trace/" placeholder="ws://localhost:8080/api/workflow/ws/trace/">
        </div>

        <div class="form-group">
            <label for="runId">Run ID</label>
            <input type="text" id="runId" placeholder="Enter your workflow run ID">
        </div>

        <div class="button-group">
            <button class="btn-connect" onclick="connect()">Connect</button>
            <button class="btn-disconnect" onclick="disconnect()" disabled>Disconnect</button>
            <button class="btn-clear" onclick="clearTraces()">Clear Traces</button>
        </div>
    </div>

    <div class="status">
        <div class="status-indicator disconnected" id="statusIndicator"></div>
        <span class="status-text" id="statusText">Disconnected</span>
        <div class="stats">
            <div class="stat-item">
                <span>📊 Traces:</span>
                <strong id="traceCount">0</strong>
            </div>
            <div class="stat-item">
                <span>⏱️ Duration:</span>
                <strong id="duration">0s</strong>
            </div>
        </div>
    </div>

    <div class="traces-container" id="tracesContainer">
        <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No traces yet</h3>
            <p>Connect to a workflow to see live traces</p>
        </div>
    </div>
</div>

<script>
    let ws = null;
    let traceCount = 0;
    let startTime = null;
    let durationInterval = null;

    function connect() {
        const serverUrl = document.getElementById('serverUrl').value;
        const runId = document.getElementById('runId').value.trim();

        if (!runId) {
            alert('Please enter a Run ID');
            return;
        }

        const wsUrl = serverUrl + runId;
        console.log('Connecting to:', wsUrl);

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log('✅ WebSocket connected');
            updateStatus('connected', 'Connected');
            startTime = Date.now();
            startDurationTimer();
            document.querySelector('.btn-connect').disabled = true;
            document.querySelector('.btn-disconnect').disabled = false;
        };

        ws.onmessage = (event) => {
            console.log('📨 Message received:', event.data);
            try {
                const trace = JSON.parse(event.data);
                addTrace(trace);
            } catch (error) {
                console.error('Failed to parse message:', error);
            }
        };

        ws.onerror = (error) => {
            console.error('❌ WebSocket error:', error);
            updateStatus('disconnected', 'Error occurred');
        };

        ws.onclose = (event) => {
            console.log('🔌 WebSocket closed:', event.code, event.reason);
            updateStatus('disconnected', 'Disconnected');
            stopDurationTimer();
            document.querySelector('.btn-connect').disabled = false;
            document.querySelector('.btn-disconnect').disabled = true;
        };
    }

    function disconnect() {
        if (ws) {
            ws.close(1000, 'User disconnect');
            ws = null;
        }
    }

    function updateStatus(status, text) {
        const indicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');

        indicator.className = `status-indicator ${status}`;
        statusText.textContent = text;
    }

    function addTrace(trace) {
        traceCount++;
        document.getElementById('traceCount').textContent = traceCount;

        const container = document.getElementById('tracesContainer');

        // Remove empty state if present
        if (container.querySelector('.empty-state')) {
            container.innerHTML = '';
        }

        const traceElement = document.createElement('div');
        traceElement.className = `trace-item status-${trace.status.toLowerCase()}`;

        const statusClass = trace.status.toLowerCase();
        const statusEmoji = {
            'running': '⏳',
            'complete': '✅',
            'error': '❌'
        }[statusClass] || '📝';

        traceElement.innerHTML = `
                <div class="trace-header">
                    <div class="trace-title">${statusEmoji} ${trace.nodeId} (${trace.nodeType})</div>
                    <span class="trace-status ${statusClass}">${trace.status}</span>
                </div>
                <div class="trace-details">
                    <div>⏰ Started: ${new Date(trace.startedAt).toLocaleTimeString()}</div>
                    ${trace.completedAt ? `<div>✓ Completed: ${new Date(trace.completedAt).toLocaleTimeString()}</div>` : ''}
                    ${trace.error ? `<div style="color: #dc3545;">⚠️ Error: ${trace.error}</div>` : ''}
                </div>
                ${trace.input || trace.output ? `
                    <div class="trace-data">
                        ${trace.input ? `<div><strong>Input:</strong> ${JSON.stringify(trace.input, null, 2)}</div>` : ''}
                        ${trace.output ? `<div><strong>Output:</strong> ${JSON.stringify(trace.output, null, 2)}</div>` : ''}
                    </div>
                ` : ''}
            `;

        container.insertBefore(traceElement, container.firstChild);
    }

    function clearTraces() {
        traceCount = 0;
        document.getElementById('traceCount').textContent = '0';
        document.getElementById('tracesContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>No traces yet</h3>
                    <p>Connect to a workflow to see live traces</p>
                </div>
            `;
    }

    function startDurationTimer() {
        durationInterval = setInterval(() => {
            if (startTime) {
                const seconds = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('duration').textContent = `${seconds}s`;
            }
        }, 1000);
    }

    function stopDurationTimer() {
        if (durationInterval) {
            clearInterval(durationInterval);
            durationInterval = null;
        }
    }

    // Handle page unload
    window.addEventListener('beforeunload', () => {
        if (ws) {
            ws.close();
        }
    });
</script>
</body>
</html>
